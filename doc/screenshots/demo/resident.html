<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>cc-view 常驻 demo</title>
<link rel="stylesheet" href="_base.css">
<style>
  /* 常驻内部样式（从 src/components/ResidentView.vue 抄，B 布局带状态文字） */
  .resident { position: relative; padding: 6px 0 8px; width: 248px; }
  .expand-btn {
    position: absolute; top: 5px; right: 6px;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; border: none; background: none;
    color: var(--color-tertiary); cursor: pointer; padding: 0;
  }
  .group-head {
    display: flex; align-items: center; gap: 5px;
    padding: 9px 12px 3px;
    font: 600 9px/1 var(--font-utility);
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--color-muted);
  }
  .group-head .cnt {
    color: var(--color-tertiary); background: var(--color-border);
    border-radius: 7px; padding: 0 5px; font-size: 9px; line-height: 13px;
  }
  .proj-head { padding: 4px 12px 1px; font: 600 10px/1 var(--font-utility); color: var(--color-muted); }
  .group-sep { height: 1px; background: var(--color-border); margin: 4px 10px 0; }
  .row {
    display: flex; align-items: center; gap: 8px;
    height: 26px; padding: 0 12px;
    border-left: 2px solid transparent;
  }
  .row.perm { border-left-color: var(--status-permission); background: color-mix(in srgb, var(--status-permission) 10%, transparent); }
  .row.reply { border-left-color: var(--status-reply); background: color-mix(in srgb, var(--status-reply) 10%, transparent); }
  .row.dim { opacity: 0.45; }
  .status-icon { flex-shrink: 0; display: block; }
  .name {
    flex: 1; min-width: 0;
    font: 600 12px/1 var(--font-body);
    color: var(--color-fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .st { flex-shrink: 0; padding-left: 8px; font: 400 10px/1 var(--font-body); color: var(--color-muted); }
  .st.work { color: var(--status-working-ink); }
  .st.reply { color: var(--status-reply-ink); }
  .st.perm { color: var(--status-permission); }
</style>
</head>
<body>
  <div class="frame"><div class="app"><div class="resident">

    <button class="expand-btn" aria-label="展开成命令面板">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V5a2 2 0 0 1 2-2h3" /><path d="M16 3h3a2 2 0 0 1 2 2v3" />
        <path d="M21 16v3a2 2 0 0 1-2 2h-3" /><path d="M8 21H5a2 2 0 0 1-2-2v-3" />
      </svg>
    </button>

    <div class="group-head">待介入 <span class="cnt">5</span></div>

    <div class="proj-head">~/ai/cc-view</div>
    <div class="row perm">
      <svg class="status-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--status-permission)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.75" y="7" width="10.5" height="6.5" rx="1.25" /><path d="M4.75 7 V4.75 A3.25 3.25 0 0 1 11.25 4.75 V7" />
      </svg>
      <span class="name">token 统计详情</span>
      <span class="st perm">等权限</span>
    </div>
    <div class="row">
      <svg class="status-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--status-working-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="5.5" stroke-dasharray="9 100" transform="rotate(-90 8 8)" />
      </svg>
      <span class="name">截图美化方案</span>
      <span class="st work">工作中</span>
    </div>
    <div class="row reply">
      <svg class="status-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--status-reply)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.06 6 a2 2 0 0 1 3.89 0.67 c0 1.33 -2 2 -2 2" /><circle cx="8" cy="11.3" r="0.6" fill="currentColor" stroke="none" />
      </svg>
      <span class="name">snoozed 自动取消</span>
      <span class="st reply">等回答</span>
    </div>

    <div class="proj-head">~/web/portfolio</div>
    <div class="row">
      <svg class="status-icon" width="16" height="16" viewBox="0 0 16 16" stroke="var(--status-waiting)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4" cy="8" r="1.3" fill="var(--status-waiting)" stroke="none" /><circle cx="8" cy="8" r="1.3" fill="var(--status-waiting)" stroke="none" /><circle cx="12" cy="8" r="1.3" fill="var(--status-waiting)" stroke="none" />
      </svg>
      <span class="name">首页 hero 改版</span>
      <span class="st">等输入</span>
    </div>
    <div class="row">
      <svg class="status-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--status-working-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="5.5" stroke-dasharray="9 100" transform="rotate(-90 8 8)" />
      </svg>
      <span class="name">暗色模式适配</span>
      <span class="st work">工作中</span>
    </div>

    <div class="group-sep"></div>
    <div class="group-head">已搁置 <span class="cnt">1</span></div>
    <div class="proj-head">~/ai/cc-view</div>
    <div class="row dim">
      <svg class="status-icon" width="16" height="16" viewBox="0 0 16 16" stroke="var(--status-waiting)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4" cy="8" r="1.3" fill="var(--status-waiting)" stroke="none" /><circle cx="8" cy="8" r="1.3" fill="var(--status-waiting)" stroke="none" /><circle cx="12" cy="8" r="1.3" fill="var(--status-waiting)" stroke="none" />
      </svg>
      <span class="name">README 文案润色</span>
      <span class="st">等输入</span>
    </div>

  </div></div></div>
</body>
</html>
