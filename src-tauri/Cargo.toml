[package]
name = "cc-view"
version = "0.1.0"
description = "Cross-terminal Claude Code session monitor for macOS menubar"
authors = ["zhuyuchen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang.org/cargo/issues/8519
name = "cc_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"  # Plan 2 §7/§8 discovery 将用于进程 env 扫描；Plan 1 暂未使用
libc = "0.2"
dirs = "5"
